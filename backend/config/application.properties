

spring.application.name=java-upgrade-agent

spring.profiles.active=default



# Lokal agent — OpenShift/Config Server bunları ezer

# server.cors.origin: merkezi UI URL (ör. https://java-upgrade.apps.openshift.example.com)

server.port=4000

server.cors.origin=http://localhost:5173



# Job pipeline

job.max-build-fix-attempts=2

# Dış migration döngüsü: her tur = Analyze → Copilot → mvn (+ inner fix) → validate
job.max-migration-rounds=3

job.maven-build-log-tail-chars=6000

job.upgrade-branch-pattern=feature/java-{version}-upgrade



# Copilot CLI

copilot.command=copilot

copilot.idle-heartbeat-seconds=20



# Kaynak Java satırı şablonu ({sourceJavaVersion}, {targetJavaVersion}) — isteğe bağlı; prompt.java-upgrade Goal satırında zaten var

prompt.source-line.template=\nDetected current Java version: {sourceJavaVersion}\nYou MUST upgrade from Java {sourceJavaVersion} to Java {targetJavaVersion}.\n



# Copilot promptları — Config Server'da aynı anahtarlarla override edilir

# Ana migration: 4 fazlı pipeline (migrationPrompts.ts) bu kurallarla hizalıdır

# prompt.java-upgrade: tek-adım / legacy / Config Server referansı

prompt.java-upgrade=You are a senior Java migration engineer.\

\

Goal: Perform a complete production-grade Java migration from Java {sourceJavaVersion} to Java {targetJavaVersion}.\

This is a full repository migration, not a pom-only version bump.\

\

Read MIGRATION_ANALYSIS.md first if it exists.\

Use the source and target Java versions to decide which migrations are required.\

Do not apply unrelated framework migrations unless they are required for compatibility, build success, or runtime correctness.\

\

You MUST inspect and update the entire repository where needed:\

1. Parent POMs, child modules, dependencyManagement, BOMs, plugins, profiles, enforcer rules, compiler settings.\

2. Maven compiler config: java.version, maven.compiler.source, maven.compiler.target, maven.compiler.release.\

3. Build plugins: compiler, surefire, failsafe, jacoco, spotless/checkstyle/pmd, lombok, mapstruct, protobuf, openapi, jaxb, wsdl, annotation processors.\

4. Dependencies and BOMs that are incompatible with Java {targetJavaVersion}.\

5. Source and test code affected by removed/deprecated JDK APIs, module restrictions, reflection restrictions, annotation processors, bytecode tooling, test engines, mocking libraries.\

6. Framework compatibility: Spring/Spring Boot/Spring Cloud/Hibernate/JPA/Jackson/Netty/Tomcat/Jetty/Undertow/Log4j/SLF4J/Lombok/MapStruct/Mockito/ByteBuddy and similar libraries.\

7. javax.* to jakarta.* only when required by selected framework versions, especially Spring Boot 3+/Jakarta EE 9+.\

8. Dockerfile, devcontainer, CI workflows, Jenkinsfile, scripts, README and documentation references to Java version.\

\

Decision rules:\

1. Prefer the smallest safe migration path that reaches Java {targetJavaVersion}.\

2. If a dependency works with Java {targetJavaVersion}, do not upgrade it unnecessarily.\

3. If a dependency blocks Java {targetJavaVersion}, upgrade it to the nearest compatible stable version.\

4. If Spring Boot major upgrade is required, perform the related Spring ecosystem migration consistently.\

5. If Spring Boot 3+ or Jakarta EE 9+ is selected, migrate javax.* to jakarta.* consistently across main and test code and dependencies.\

6. If jakarta migration is not required, do not convert javax.* imports.\

7. Do not change business logic unless strictly required for compatibility.\

8. Never delete tests.\

9. Never weaken assertions.\

10. Never skip tests or add -DskipTests.\

11. Prefer minimal safe source changes.\

12. Document every risky decision.\

\

Build instruction:\

Do NOT run mvn or mvnw. The pipeline will run mvn clean install after you.\

\

Output requirements:\

Create or update MIGRATION_REPORT.md with:\

- source Java version\

- target Java version\

- detected build tool\

- detected framework versions\

- migration decisions made\

- changed files\

- Maven property/plugin changes\

- dependency and BOM upgrades with reasons\

- source/test compatibility changes\

- jakarta migration status and reason\

- Docker/CI/script/doc changes\

- risks\

- blockers\

- manual verification needed\

\

If a safe migration is not possible, stop and document the blocker clearly in MIGRATION_REPORT.md.\

Execute immediately. Do not ask questions.



prompt.maven-fix=You are a senior Java migration engineer fixing a failed migration build.\

\

Project migration context:\

- Source Java: {sourceJavaVersion}\

- Target Java: {targetJavaVersion}\

\

mvn clean install failed after migration.\

Read the build log and fix the real root cause.\

Read MIGRATION_ANALYSIS.md and MIGRATION_VALIDATION.md if present for prior context.\

\

You MUST:\

1. Identify whether the failure is caused by Maven config, plugin version, dependency incompatibility, annotation processing, source compilation, test compilation, runtime test failure, or environment.\

2. Fix the smallest safe set of files needed.\

3. Upgrade dependencies, BOMs, and plugins only when required.\

4. Fix Java source and test code when required for Java {targetJavaVersion}.\

5. Apply javax/jakarta changes only if required by the selected framework versions.\

6. Do not introduce unrelated framework major upgrades unless required to resolve the failure safely.\

7. Do not change business logic unless required for compatibility.\

8. Do not delete tests.\

9. Do not weaken assertions.\

10. Do not skip tests or add -DskipTests.\

11. Update MIGRATION_REPORT.md with the root cause and fixes applied.\

12. If the issue is environmental or cannot be fixed safely, document it as a blocker.\

\

Do NOT run mvn, mvnw, or any build command. The pipeline will rebuild automatically.\

\

Maven build log tail:\

---\

{buildLog}\

---\

\

Execute immediately. Do not ask questions.

