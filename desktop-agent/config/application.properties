# Paytion Java Upgrade Desktop Agent — job pipeline ayarları
# APP_CONFIG_FILE ortam değişkeni ile farklı dosya gösterilebilir.

job.max-build-fix-attempts=2
job.max-migration-rounds=3
job.maven-build-log-tail-chars=6000
job.smoke-run-enabled=true
job.smoke-run-timeout-seconds=120
job.smoke-run-profile=
job.max-smoke-fix-attempts=2
job.startup-run-mode=jar
job.startup-post-success-seconds=15
job.upgrade-branch-pattern=feature/java-{version}-upgrade

copilot.command=copilot
copilot.idle-heartbeat-seconds=20
copilot.model=auto
